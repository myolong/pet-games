# 냥이 꼬리기차 같이 하기 서버 (Fly.io 도쿄). 게임 상태를 서버 메모리에 두므로 서버는 한 대만 켠다.
app = "nyangnyang-cattrain"
primary_region = "nrt"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
