# 냥이 털실 굴리기 같이 하기 서버를 Fly.io 도쿄에 올린다.
# 저장소 Secrets에 FLY_API_TOKEN이 있어야 한다.
name: 털실 굴리기 서버 배포 (Fly.io)

on:
  push:
    branches: [main]
    paths:
      - 'server-yarn/**'
      - 'server/src/budget.js'
      - 'games/yarn/sim.js'
      - '.github/workflows/yarn-fly.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@1.5
      # 처음 한 번은 앱을 만든다 (이미 있으면 그냥 넘어간다)
      - run: flyctl apps create nyangnyang-yarn || true
      # 요금 기록용 저장 공간 (1GB, 도쿄). 없을 때만 만든다
      - run: flyctl volumes list -a nyangnyang-yarn | grep -q yarn_data || flyctl volumes create yarn_data -a nyangnyang-yarn -r nrt -s 1 --yes
      - run: flyctl deploy . --config server-yarn/fly.toml --dockerfile server-yarn/Dockerfile --remote-only --ha=false
