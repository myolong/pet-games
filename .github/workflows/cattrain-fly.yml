# 냥이 꼬리기차 같이 하기 서버를 Fly.io 도쿄에 올린다.
# 저장소 Secrets에 FLY_API_TOKEN이 있어야 한다.
name: 꼬리기차 서버 배포 (Fly.io)

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'games/cattrain/sim.js'
      - '.github/workflows/cattrain-fly.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@1.5
      # 처음 한 번은 앱을 만든다 (이미 있으면 그냥 넘어간다)
      - run: flyctl apps create nyangnyang-cattrain || true
      - run: flyctl deploy . --config server/fly.toml --dockerfile server/Dockerfile --remote-only --ha=false
