# 냥이 털실 굴리기 같이 하기 서버 (Fly.io 도쿄). 게임 상태를 서버 메모리에 두므로 서버는 한 대만 쓴다.
# 요금을 아끼려고 접속한 사람이 없으면 서버가 꺼지고, 누가 들어오면 몇 초 만에 다시 켜진다.
app = "nyangnyang-yarn"
primary_region = "nrt"

# 이번 달 쓴 시간·데이터 기록 (요금 상한용, 이 서버만 따로 월 2달러). 1GB
[mounts]
  source = "yarn_data"
  destination = "/data"

[env]
  BUDGET_USD = "2.0"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
